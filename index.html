<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VideoCutter - Split & Export Videos</title>
    <meta name="description"
        content="Client-side video cutter and splitter. No upload required, works entirely in your browser.">
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div id="app">
        <!-- Upload Screen -->
        <div id="upload-screen" class="screen active">
            <div id="drop-zone">
                <div class="drop-zone-content">
                    <div class="drop-icon">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="17 8 12 3 7 8" />
                            <line x1="12" y1="3" x2="12" y2="15" />
                        </svg>
                    </div>
                    <h1>VideoCutter</h1>
                    <p>Drag & drop your video here</p>
                    <span class="or-divider">or</span>
                    <button id="browse-btn" class="btn-primary">Browse Files</button>
                    <input type="file" id="file-input" accept="video/*" hidden>
                    <p class="supported-formats">Supports MP4, WebM, MKV, AVI, MOV and more</p>
                </div>
            </div>
            <div id="loading-ffmpeg" class="loading-overlay hidden">
                <div class="spinner"></div>
                <p>Loading FFmpeg...</p>
            </div>
        </div>

        <!-- Editor Screen -->
        <div id="editor-screen" class="screen">
            <header class="editor-header">
                <button id="back-btn" class="btn-icon" title="Back to upload">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                </button>
                <div class="file-info">
                    <span id="file-name">video.mp4</span>
                    <span id="file-duration">00:00:00</span>
                </div>
                <button id="export-btn" class="btn-primary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                        <polyline points="7 10 12 15 17 10" />
                        <line x1="12" y1="15" x2="12" y2="3" />
                    </svg>
                    Export
                </button>
            </header>

            <main class="editor-main">
                <video id="video-player" playsinline></video>
            </main>

            <footer class="editor-footer">
                <div class="timeline-toolbar">
                    <div class="toolbar-left">
                        <button id="play-pause-btn" class="btn-icon" title="Play/Pause (Space)">
                            <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor">
                                <polygon points="5 3 19 12 5 21 5 3" />
                            </svg>
                            <svg class="icon-pause hidden" viewBox="0 0 24 24" fill="currentColor">
                                <rect x="6" y="4" width="4" height="16" />
                                <rect x="14" y="4" width="4" height="16" />
                            </svg>
                        </button>
                        <span class="time-display">
                            <span id="current-time">00:00:00</span>
                            <span class="time-separator">/</span>
                            <span id="total-duration">00:00:00</span>
                        </span>
                        <div class="toolbar-divider"></div>
                        <button id="scissors-btn" class="btn-tool" title="Cut at playhead (C)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="6" cy="6" r="3" />
                                <circle cx="6" cy="18" r="3" />
                                <line x1="20" y1="4" x2="8.12" y2="15.88" />
                                <line x1="14.47" y1="14.48" x2="20" y2="20" />
                                <line x1="8.12" y1="8.12" x2="12" y2="12" />
                            </svg>
                            Cut
                        </button>
                        <button id="delete-segment-btn" class="btn-tool" title="Delete selected segment (Del)" disabled>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polyline points="3 6 5 6 21 6" />
                                <path
                                    d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                                <line x1="10" y1="11" x2="10" y2="17" />
                                <line x1="14" y1="11" x2="14" y2="17" />
                            </svg>
                            Delete
                        </button>
                    </div>
                    <div class="toolbar-center">
                        <label class="snap-toggle" title="Segment snaps to playhead when moving/resizing">
                            <input type="checkbox" id="snap-segment-to-playhead" checked>
                            <span>Segment → Playhead</span>
                        </label>
                        <label class="snap-toggle" title="Playhead snaps to segment edges when clicking">
                            <input type="checkbox" id="snap-playhead-to-segment" checked>
                            <span>Playhead → Segment</span>
                        </label>
                        <span id="segments-count">0 segments</span>
                    </div>
                    <div class="toolbar-right">
                        <button id="zoom-out-btn" class="btn-icon" title="Zoom out (-)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                                <line x1="8" y1="11" x2="14" y2="11" />
                            </svg>
                        </button>
                        <input type="number" id="zoom-level" value="100" min="1" max="1000"
                            title="Enter zoom level (1-1000)">
                        <button id="zoom-in-btn" class="btn-icon" title="Zoom in (+)">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="11" cy="11" r="8" />
                                <line x1="21" y1="21" x2="16.65" y2="16.65" />
                                <line x1="11" y1="8" x2="11" y2="14" />
                                <line x1="8" y1="11" x2="14" y2="11" />
                            </svg>
                        </button>
                    </div>
                </div>
                <div id="timeline-container">
                    <div id="timeline">
                        <div id="timeline-ruler"></div>
                        <div id="timeline-segments"></div>
                        <div id="playhead">
                            <div class="playhead-line"></div>
                            <div class="playhead-handle"></div>
                        </div>
                    </div>
                </div>
            </footer>
        </div>

        <!-- Export Screen -->
        <div id="export-screen" class="screen">
            <div class="export-content">
                <h2>Exporting Video</h2>
                <div class="progress-container">
                    <div id="export-progress" class="progress-bar">
                        <div class="progress-fill"></div>
                    </div>
                    <span id="export-percent">0%</span>
                </div>
                <p id="export-status">Preparing...</p>
                <button id="cancel-export-btn" class="btn-secondary">Cancel</button>
            </div>
        </div>

        <!-- Export Complete Screen -->
        <div id="complete-screen" class="screen">
            <div class="complete-content">
                <div class="success-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14" />
                        <polyline points="22 4 12 14.01 9 11.01" />
                    </svg>
                </div>
                <h2>Export Complete!</h2>
                <p id="export-filename">output.mp4</p>
                <div class="complete-actions">
                    <button id="download-btn" class="btn-primary">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                            <polyline points="7 10 12 15 17 10" />
                            <line x1="12" y1="15" x2="12" y2="3" />
                        </svg>
                        Download
                    </button>
                    <button id="edit-again-btn" class="btn-secondary">Edit Again</button>
                    <button id="new-video-btn" class="btn-secondary">New Video</button>
                </div>
            </div>
        </div>
    </div>

    <script src="ffmpeg-core/ffmpeg.js"></script>
    <script src="ffmpeg-core/util.js"></script>
    <script type="module" src="app.js"></script>
</body>

</html>
